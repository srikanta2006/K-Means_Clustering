version: '3.8'

services:
  streamlit-app:
    build: .
    container_name: kmeans-clustering
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./Whole_Sale.csv:/app/Whole_Sale.csv
    restart: unless-stopped
